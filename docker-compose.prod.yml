services:
  postgres:
    image: postgres:16-alpine
    container_name: custode-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-custode}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-custode}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - custode-internal-network

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: custode-migration
    restart: "no"
    command: ["python", "scripts/migrate.py"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-custode}
      SECRET_KEY: ${SECRET_KEY}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - custode-internal-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: custode-backend-prod
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      AUTH_MODE: "production"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-custode}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["https://custode.example.com"]'}
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - custode-internal-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: custode-frontend-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - custode-internal-network

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: custode-proxy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - custode-internal-network

networks:
  custode-internal-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
